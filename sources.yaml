# Text sources for the local library.
#
# Re-run `python -m apologetics.ingest` after editing. Sources whose entry has
# not changed are skipped; changed or new sources are re-fetched and re-indexed.
#
# Fields common to every source:
#   id      unique slug, used as the Chroma metadata key and cache directory
#   title   human-readable name used in citations
#   kind    parser to use (see below)
#   enabled optional, default true
#
# Kinds:
#   douay_rheims_gutenberg   Project Gutenberg plain-text Douay-Rheims Bible (url)
#   catechism_vatican        Vatican IntraText CCC; crawls every __P*.HTM page from index_url
#   newadvent_fathers        New Advent Church Fathers; `urls` are work pages, each
#                            crawled for same-prefix sub-pages (books/chapters)
#   newadvent_summa          New Advent Summa; `index_urls` are part indexes
#                            (1.htm, 2.htm, 3.htm, 4.htm, 5.htm), crawled for question pages
#   catholic_answers         Catholic Answers tract/magazine/article pages (urls)
#
# Optional per-source `max_pages` caps a crawl while testing.

sources:
  - id: douay-rheims
    title: Douay-Rheims Bible
    kind: douay_rheims_gutenberg
    url: https://www.gutenberg.org/cache/epub/8300/pg8300.txt

  - id: ccc
    title: Catechism of the Catholic Church
    kind: catechism_vatican
    index_url: https://www.vatican.va/archive/ENG0015/_INDEX.HTM

  - id: fathers
    title: Church Fathers (New Advent)
    kind: newadvent_fathers
    urls:

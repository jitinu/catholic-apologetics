      - https://www.newadvent.org/fathers/0107.htm   # Ignatius, Romans
      - https://www.newadvent.org/fathers/0108.htm   # Ignatius, Philadelphians
      - https://www.newadvent.org/fathers/0109.htm   # Ignatius, Smyrnaeans
      - https://www.newadvent.org/fathers/0110.htm   # Ignatius, Polycarp
      - https://www.newadvent.org/fathers/0136.htm   # Polycarp, Philippians
      - https://www.newadvent.org/fathers/0102.htm   # Martyrdom of Polycarp

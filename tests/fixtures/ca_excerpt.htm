<html><head><meta name="author" content="Jimmy Akin"></head>
<body><article><h1>What the Early Church Believed: The Real Presence</h1>
<div class="body-half">
<p>The doctrine of the Real Presence asserts that Jesus is literally present.</p>
<p>The Eucharist is not merely a symbol but the body and blood of Christ.</p>
</div>
<div class="body-half">
<h2>Ignatius of Antioch</h2>
<p>Ignatius called the Eucharist the medicine of immortality.</p>
</div></article></body></html>

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catholic-apologetics"
version = "0.1.0"
description = "Local retrieval-augmented Catholic apologetics Q&A tool"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4==4.15.0",
  "chromadb==1.5.9",
  "google-genai>=1.75.0,<2",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "streamlit==1.64.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
